name: Android and security checks
on:
  push:
    branches: ['arena/b7b90880-ownerbook', main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist
        env:
          CI: '1'
      - name: Validate native Android project generation
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
      - run: npm run check:android
